# Builds and tests the package on every PR and on main. Devin Review reads
# the diff; this runs the tests — the two checks auto-merge waits for.
# macos-26 carries the Xcode 26 toolchain the manifest needs
# (swift-tools-version 6.2, .defaultIsolation). Public repo: runner minutes
# are free. docs/GitHubWorkflowProposal.md §5.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
